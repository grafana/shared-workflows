name: Test get-vault-blessed-operations-secrets action

on:
  push:
    branches:
      - main
    paths:
      - "actions/get-vault-blessed-operations-secrets/**"
      - ".github/workflows/test-get-vault-blessed-operations-secrets.yaml"

  pull_request:
    paths:
      - "actions/get-vault-blessed-operations-secrets/**"
      - ".github/workflows/test-get-vault-blessed-operations-secrets.yaml"
    types:
      - edited
      - opened
      - ready_for_review
      - synchronize

  merge_group:

permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install bun package manager
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - name: Run tests
        run: bun test actions/get-vault-blessed-operations-secrets

  # The action must refuse every run that is not an adopted repository going
  # through its operation's blessed workflow. shared-workflows has adopted no
  # operation, so each case below has to fail: bad inputs before reaching
  # Vault, and a well-formed request at the Vault login.
  must-fail:
    strategy:
      matrix:
        include:
          - case: invalid vault_instance
            operation: test_operation
            vault_instance: prod
          - case: invalid operation name
            operation: ../common
            vault_instance: dev
          - case: operation not adopted by this repository
            operation: test_operation
            vault_instance: dev

    name: "must fail: ${{ matrix.case }}"
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    # OIDC tokens are only issued to `grafana` repositories, so skip forks. The
    # merge queue still runs this before merging.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.owner.login == 'grafana'

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run the action
        id: action
        uses: ./actions/get-vault-blessed-operations-secrets
        continue-on-error: true
        with:
          operation: ${{ matrix.operation }}
          vault_instance: ${{ matrix.vault_instance }}
          secrets: |
            VALUE=test:value

      - name: Check the action failed
        if: steps.action.outcome != 'failure'
        env:
          CASE: ${{ matrix.case }}
        run: |
          echo "Test failed: '${CASE}' should have errored"
          exit 1
