name: Test Renovate repository policy

on:
  pull_request:
    paths:
      - scripts/check-renovate-enabled/**
      - .github/workflows/global-renovate-policy.yml
      - .github/workflows/test-renovate-policy.yml
  push:
    branches: [main]
    paths:
      - scripts/check-renovate-enabled/**
      - .github/workflows/global-renovate-policy.yml
      - .github/workflows/test-renovate-policy.yml
  merge_group:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-x64-small
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: scripts/check-renovate-enabled/package-lock.json
      - name: Install and test policy checker
        working-directory: scripts/check-renovate-enabled
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
