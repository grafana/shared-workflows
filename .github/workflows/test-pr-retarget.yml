name: Lint & test PR retarget action

on:
  push:
    branches: [main]
    paths:
      - actions/pr-retarget/**
      - .github/workflows/test-pr-retarget.yml
      - eslint.config.mjs
      - package.json
      - bun.lock
  pull_request:
    paths:
      - actions/pr-retarget/**
      - .github/workflows/test-pr-retarget.yml
      - eslint.config.mjs
      - package.json
      - bun.lock
    types: [opened, reopened, synchronize, edited, ready_for_review]
  merge_group:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install lint dependencies
        run: bun install --frozen-lockfile --linker hoisted
      - name: Lint
        run: bun run eslint actions/pr-retarget
      - name: Test routing and authorization
        run: node --test actions/pr-retarget/retarget.test.mjs
