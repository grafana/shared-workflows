name: Test OpenAPI client generation

on:
  pull_request:
    paths:
      - actions/generate-openapi-clients/**
      - .github/workflows/test-generate-openapi-clients.yml
  push:
    branches: [main]
    paths:
      - actions/generate-openapi-clients/**
      - .github/workflows/test-generate-openapi-clients.yml
  merge_group:

permissions: {}

jobs:
  test:
    strategy:
      matrix:
        node: [20.19.0, 22.16.0, 24.x]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Download OpenAPI Generator
        run: curl --fail --location --retry 3 https://repo.maven.apache.org/maven2/org/openapitools/openapi-generator-cli/7.7.0/openapi-generator-cli-7.7.0.jar -o "$RUNNER_TEMP/openapi-generator-cli.jar"
      - run: python3 -m unittest discover -s actions/generate-openapi-clients -v
        env:
          OPENAPI_GENERATOR_JAR: ${{ runner.temp }}/openapi-generator-cli.jar
