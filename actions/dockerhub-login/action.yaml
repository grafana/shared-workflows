name: Login to DockerHub
description: Log in to Docker Hub as the grafana organization with a short-lived, pull-only OIDC token

runs:
  using: composite
  steps:
    - name: Reject pull_request_target
      if: ${{ github.event_name == 'pull_request_target' }}
      shell: bash
      run: |
        echo "::error::dockerhub-login does not support pull_request_target. Use pull_request instead."
        exit 1

    - name: Log in to Docker Hub
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      with:
        username: grafana
      env:
        # TODO: replace with the Docker Hub OIDC connection ID once we decide where it is stored.
        DOCKERHUB_OIDC_CONNECTIONID: <placeholder>
        DOCKERHUB_OIDC_EXPIREIN: "1800" # 30 minutes
