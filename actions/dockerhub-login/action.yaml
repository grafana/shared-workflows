name: Login to DockerHub
description: Log in to Docker Hub as the grafana organization with a short-lived, pull-only OIDC token

inputs:
  connection-id:
    description: |
      Docker Hub OIDC connection ID. Defaults to the connection for the `grafana` GitHub org.
      Repositories in other GitHub orgs must pass their org's connection ID.
      Not a secret: the connection's rulesets decide which workflows get a token.
    required: false
    default: e14404e0-cb2e-419e-89da-f08af0347345

runs:
  using: composite
  steps:
    - name: Reject pull_request_target
      if: ${{ github.event_name == 'pull_request_target' }}
      shell: bash
      run: |
        echo "::error::dockerhub-login does not support pull_request_target. Use pull_request instead."
        exit 1

    - name: Log in to Docker Hub
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      with:
        username: grafana
      env:
        DOCKERHUB_OIDC_CONNECTIONID: ${{ inputs.connection-id }}
        DOCKERHUB_OIDC_EXPIREIN: "3600" # 1 hour
