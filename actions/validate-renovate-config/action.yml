name: Validate Renovate Config
description: Validates Renovate configuration files using renovate-config-validator

inputs:
  path:
    description: Path to the Renovate config file to validate (e.g., 'renovate.json')
    required: false
    default: renovate.json

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "24"

    - name: Validate Renovate config
      shell: bash
      run: npx --yes --package ${RENOVATE_VERSION} -- renovate-config-validator "${CONFIG_PATH}"
      env:
        CONFIG_PATH: ${{ inputs.path }}
        RENOVATE_VERSION: renovate@43.232

    - name: Prevent repository-wide disabling
      shell: bash
      run: |
        normalized_config="$(mktemp)"
        trap 'rm -f "$normalized_config"' EXIT
        npx --yes --package "$JSON5_VERSION" -- json5 --out-file "$normalized_config" < "$CONFIG_PATH"
        node "$ACTION_PATH/check-policy.cjs" "$normalized_config"
      env:
        CONFIG_PATH: ${{ inputs.path }}
        ACTION_PATH: ${{ github.action_path }}
        JSON5_VERSION: json5@2.2.3
