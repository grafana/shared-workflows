name: Push to cloud storage
description: Composite action to push to Google Cloud Storage
inputs:
  bucket:
    description: |
      Name of bucket to upload to. Can be gathered from the `login-to-gcs` action.
      Will default to grafanalabs-${repository.name}-${environment}
    default: ""
  path:
    description: |
      The path to a file or folder inside the action's filesystem
      that should be uploaded to the bucket.
      You can specify either the absolute path or the relative path from the action.
    required: true
  bucket_path:
    description: |
      Bucket path where objects will be uploaded. Default is the bucket root.
    default: ""
  environment:
    description: |
      Environment for uploading objects (can be either dev or prod).
    default: dev
  glob:
    description: |
      Glob pattern.
  parent:
    description: |
      Whether parent dir should be included in GCS destination.
      Dirs included in the `glob` statement are unaffected by this setting.
    default: "true"
  predefinedAcl:
    description: |
      Apply a predefined set of access controls to the file(s).
      Default is projectPrivate (See https://googleapis.dev/nodejs/storage/latest/global.html#UploadOptions)
    default: projectPrivate
  service_account:
    description: |
      Custom service account to use for authentication.
    default: ""
  delete_credentials_file:
    description: |
      Delete the credentials file after the action is finished.
      If you want to keep the credentials file for a later step, set this to false.
    default: "true"
  gzip:
    description: |
      If true, then upload files with `content-encoding: gzip`
    default: "true"
  use_gcloud:
    description: |
      Use the gcloud CLI instead of the Node upload action.
    required: false
    default: "false"
  use_wif_auth:
    description: |
      Use WIF for authentication instead of service account.
    required: false
    default: "false"

outputs:
  uploaded:
    description: "The list of successfully uploaded files."
    value: ${{ steps.upload-files.outputs.uploaded || steps.upload-files-gcloud.outputs.uploaded }}

runs:
  using: composite
  steps:
    - name: Resolve GCP project
      id: resolve-project
      shell: bash
      env:
        ENVIRONMENT: ${{ inputs.environment }}
      run: |
        if [[ "${ENVIRONMENT}" == "dev" ]]; then
          PROJECT="grafanalabs-dev"
        elif [[ "${ENVIRONMENT}" == "prod" ]]; then
          PROJECT="grafanalabs-global"
        else
          echo "Invalid environment. Valid environment variable inputs: dev, prod"
          exit 1
        fi
        echo "project=${PROJECT}" | tee -a ${GITHUB_OUTPUT}
    - name: Login to GCS
      id: login-to-gcs
      uses: grafana/shared-workflows/actions/login-to-gcs@1f02013f3a8a0c29e3cb7dc6793158defe914569 # login-to-gcs/v0.3.1
      with:
        bucket: ${{ inputs.bucket }}
        environment: ${{ inputs.environment }}
        service_account: ${{ inputs.bucket && inputs.service_account || '' }}
        delete_credentials_file: false
        use_wif_auth: ${{ inputs.use_wif_auth }}
    - name: Construct path
      id: construct-path
      shell: bash
      env:
        BUCKET: ${{ steps.login-to-gcs.outputs.bucket }}
        BUCKET_PATH: ${{ inputs.bucket_path }}
      run: |
        # Join bucket name with bucket_path (Ex: bucket_name/path/to/file)
        DESTINATION="${BUCKET}/${BUCKET_PATH}"
        DESTINATION="${DESTINATION%/}"  # strip trailing /

        echo "destination=${DESTINATION}" | tee -a ${GITHUB_OUTPUT}
    - uses: google-github-actions/upload-cloud-storage@6397bd7208e18d13ba2619ee21b9873edc94427a # v3.0.0
      id: upload-files
      if: inputs.use_gcloud != 'true'
      with:
        path: ${{ inputs.path }}
        glob: ${{ inputs.glob }}
        destination: ${{ steps.construct-path.outputs.destination }} # bucket name plus folder prefix (if applicable)
        parent: ${{ inputs.parent }}
        predefinedAcl: ${{ inputs.use_wif_auth == 'true' && ' ' || inputs.predefinedAcl }} # when using WIF auth, we cannot use predefinedAcl
        gzip: ${{ inputs.gzip }}
        process_gcloudignore: false

    # setup-gcloud runs `gcloud auth login` once, with no retry, and fetching
    # the OIDC subject token for it occasionally times out. If it fails, wait
    # and run setup-gcloud again (up to 2 retries); gcloud is already installed
    # by then, so each retry is effectively just another login attempt.
    - name: Setup `gcloud` CLI
      id: setup-gcloud
      if: inputs.use_gcloud == 'true'
      continue-on-error: true
      uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      with:
        # Accept any version
        version:

    - name: Wait before retrying `gcloud` setup
      if: inputs.use_gcloud == 'true' && steps.setup-gcloud.outcome == 'failure'
      shell: sh
      run: |
        echo "::warning::setup-gcloud failed, retrying in 10s (attempt 2 of 3)"
        sleep 10

    - name: Setup `gcloud` CLI (retry 1)
      id: setup-gcloud-retry
      if: inputs.use_gcloud == 'true' && steps.setup-gcloud.outcome == 'failure'
      continue-on-error: true
      uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      with:
        # Accept any version
        version:

    - name: Wait before retrying `gcloud` setup again
      if: inputs.use_gcloud == 'true' && steps.setup-gcloud-retry.outcome == 'failure'
      shell: sh
      run: |
        echo "::warning::setup-gcloud failed again, retrying in 30s (attempt 3 of 3)"
        sleep 30

    # Last attempt: no continue-on-error, so a third failure fails the job
    - name: Setup `gcloud` CLI (retry 2)
      if: inputs.use_gcloud == 'true' && steps.setup-gcloud-retry.outcome == 'failure'
      uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      with:
        # Accept any version
        version:

    - name: Set up Go
      if: inputs.use_gcloud == 'true'
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: ${{ github.action_path }}/go.mod

    - name: Upload files with gcloud
      id: upload-files-gcloud
      if: inputs.use_gcloud == 'true'
      shell: bash
      env:
        SOURCE_PATH: ${{ inputs.path }}
        SOURCE_GLOB: ${{ inputs.glob }}
        DESTINATION: ${{ steps.construct-path.outputs.destination }}
        INCLUDE_PARENT: ${{ inputs.parent }}
        GZIP: ${{ inputs.gzip }}
        PREDEFINED_ACL: ${{ inputs.use_wif_auth == 'true' && ' ' || inputs.predefinedAcl }}
        # Avoid additional bucket checks and temporary objects for large files.
        CLOUDSDK_STORAGE_PARALLEL_COMPOSITE_UPLOAD_ENABLED: "False"
        GOWORK: "off"
      run: |
        set -euo pipefail
        cd "${GITHUB_ACTION_PATH}"
        go run .

    - name: Delete Google Application Credentials file
      if: ${{ inputs.delete_credentials_file == 'true' && env.GOOGLE_APPLICATION_CREDENTIALS != '' }}
      shell: sh
      run: |
        if [ -f "${GOOGLE_APPLICATION_CREDENTIALS}" ]; then
          rm -f "${GOOGLE_APPLICATION_CREDENTIALS}"
          echo "::debug::Successfully deleted credentials file"
        else
          echo "::warning::Credentials file not found at ${GOOGLE_APPLICATION_CREDENTIALS}"
        fi
      env:
        GOOGLE_APPLICATION_CREDENTIALS: ${{ env.GOOGLE_APPLICATION_CREDENTIALS }}
