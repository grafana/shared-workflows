# Default zizmor configuration for the reusable-zizmor workflow, used when the
# calling repository has no zizmor.yml or .github/zizmor.yml of its own. It
# ships with this action so it always matches the pinned version of the
# workflow. Keep it in sync with .github/zizmor.yml; test_default_config.py
# checks this.

rules:
  unpinned-uses:
    config:
      policies:
        actions/*: any # trust GitHub
        grafana/*: any # trust Grafana
