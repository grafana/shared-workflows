name: Download Branch Workflow Artifact
description: Downloads an artifact from the last successful run of a workflow on a specific branch
author: Grafana Labs

inputs:
  workflow:
    description: "Workflow filename to download artifact from (e.g. deploy-prod.yml)"
    required: true
  artifact-name:
    description: "Name of the artifact to download"
    required: true
  branch:
    description: "Branch to filter workflow runs by"
    required: false
    default: "main"
  path:
    description: "Directory to download the artifact to"
    required: false
    default: "."
  github-token:
    description: "GitHub token with actions:read permission"
    required: false
    default: ${{ github.token }}

outputs:
  found:
    description: "Whether the artifact was found and downloaded (true/false)"
    value: ${{ steps.download.outputs.found }}
  run-id:
    description: "The workflow run ID the artifact was downloaded from (empty if not found)"
    value: ${{ steps.download.outputs.run-id }}
  download-path:
    description: "Path where the artifact was downloaded"
    value: ${{ inputs.path }}

runs:
  using: composite
  steps:
    - name: Find and download the newest matching artifact
      id: download
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        INPUT_WORKFLOW: ${{ inputs.workflow }}
        INPUT_BRANCH: ${{ inputs.branch }}
        INPUT_ARTIFACT_NAME: ${{ inputs.artifact-name }}
        ZIP_PATH: ${{ runner.temp }}/download-branch-workflow-artifact.zip
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('fs');
          const workflow = process.env.INPUT_WORKFLOW;
          const branch = process.env.INPUT_BRANCH;
          const artifactName = process.env.INPUT_ARTIFACT_NAME;
          const zipPath = process.env.ZIP_PATH;

          const notFound = () => {
            core.setOutput('found', 'false');
            core.setOutput('run-id', '');
          };

          // Build the set of successful run IDs for the requested workflow + branch.
          // This is used only as a membership filter: we deliberately do NOT rely on
          // the order returned by listWorkflowRuns, because it is not stable and led
          // to older artifacts being selected at random.
          const runIds = new Set();
          try {
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: workflow,
              branch: branch,
              status: 'success',
              per_page: 100
            });
            for (const run of runs.data.workflow_runs) {
              runIds.add(run.id);
            }
          } catch (error) {
            console.log(`Failed to list runs for workflow ${workflow} on ${branch}: ${error.message}`);
          }

          if (runIds.size === 0) {
            console.log(`No successful runs found for workflow ${workflow} on branch ${branch}`);
            notFound();
            return;
          }

          // The artifacts API is eventually consistent, so read it a few times and
          // keep every matching, unexpired candidate we see across the attempts.
          const attempts = 3;
          const candidates = new Map();

          for (let attempt = 1; attempt <= attempts; attempt++) {
            try {
              const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: artifactName,
                per_page: 100
              });

              for (const artifact of artifacts) {
                if (artifact.name !== artifactName || artifact.expired) {
                  continue;
                }
                const run = artifact.workflow_run;
                if (!run || !runIds.has(run.id)) {
                  continue;
                }
                candidates.set(artifact.id, artifact);
              }
            } catch (error) {
              console.log(`Listing ${artifactName} artifacts failed on attempt ${attempt}: ${error.message}`);
            }

            if (attempt < attempts) {
              await new Promise(resolve => setTimeout(resolve, 1000));
            }
          }

          // Pick the newest artifact by creation time, breaking ties by id.
          const newest = [...candidates.values()].sort((a, b) => {
            const byCreatedAt = (Date.parse(b.created_at) || 0) - (Date.parse(a.created_at) || 0);
            return byCreatedAt !== 0 ? byCreatedAt : b.id - a.id;
          })[0];

          if (!newest) {
            console.log(`No unexpired ${artifactName} artifact found for workflow ${workflow} on branch ${branch}`);
            notFound();
            return;
          }

          const runId = newest.workflow_run ? String(newest.workflow_run.id) : '';
          console.log(`Selected ${artifactName} artifact ${newest.id} created at ${newest.created_at} by run ${runId || 'unknown'}`);

          try {
            const download = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: newest.id,
              archive_format: 'zip'
            });
            fs.writeFileSync(zipPath, Buffer.from(download.data));
          } catch (error) {
            console.log(`Downloading artifact ${newest.id} failed: ${error.message}`);
            notFound();
            return;
          }

          core.setOutput('found', 'true');
          core.setOutput('run-id', runId);
          core.setOutput('zip-path', zipPath);

    - name: Extract artifact
      if: steps.download.outputs.found == 'true'
      shell: bash
      env:
        OUTPUT_PATH: ${{ inputs.path }}
        ZIP_PATH: ${{ steps.download.outputs.zip-path }}
      run: |
        mkdir -p "$OUTPUT_PATH"
        unzip -o "$ZIP_PATH" -d "$OUTPUT_PATH"
        rm -f "$ZIP_PATH"
