name: Component Change Detection
description: Detects which components changed based on component dependencies configuration
author: Grafana Labs

inputs:
  config-file:
    description: "Path to component dependencies YAML file"
    required: true
  previous-tags-source:
    description: "Workflow name to get previous tags from"
    required: true
  target-ref:
    description: "Git ref to compare against"
    required: false
    default: "HEAD"
  force-rebuild-all:
    description: "Force rebuild all components"
    required: false
    default: "false"
  force-components:
    description: "Force rebuild specific components (comma-separated)"
    required: false
    default: ""

outputs:
  # Generic outputs for any component set
  changes_json:
    description: 'All component changes as JSON object (e.g., {"apiserver": true, "controller": false})'
    value: ${{ steps.detect.outputs.changes_json }}
  components_json:
    description: 'List of all components as JSON array (e.g., ["apiserver", "controller"])'
    value: ${{ steps.extract-components.outputs.components_json }}

runs:
  using: composite
  steps:
    - name: Extract component list from config
      id: extract-components
      shell: bash
      env:
        CONFIG_FILE: ${{ inputs.config-file }}
      run: ${{ github.action_path }}/scripts/extract-components.sh

    # Download previous component tags from the source workflow.
    # The artifacts API does not return a stable order. A stored artifact older than
    # 5 days is fetched again, up to 5 times, to look for a newer commit.
    - name: Find and download previous component tags
      id: download-previous-tags
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        INPUT_WORKFLOW: ${{ inputs.previous-tags-source }}
        ARTIFACT_NAME: component-tags
        ZIP_PATH: ${{ runner.temp }}/component-tags.zip
      with:
        script: |
          const fs = require('fs');
          const workflow = process.env.INPUT_WORKFLOW;
          const artifactName = process.env.ARTIFACT_NAME;
          const zipPath = process.env.ZIP_PATH;
          const maxRetries = 5;
          const fiveDaysMs = 5 * 24 * 60 * 60 * 1000;

          const runIds = new Set();
          const seenArtifacts = new Map();

          const newestMatching = () => {
            const matching = [...seenArtifacts.values()].filter((artifact) => {
              const run = artifact.workflow_run;
              return run && runIds.has(run.id);
            });
            matching.sort((left, right) => {
              const byCreatedAt = (Date.parse(right.created_at) || 0) - (Date.parse(left.created_at) || 0);
              return byCreatedAt !== 0 ? byCreatedAt : right.id - left.id;
            });
            return matching[0];
          };

          let newest;
          for (let attempt = 0; attempt <= maxRetries; attempt++) {
            let runsListFailed = false;
            let artifactsListFailed = false;

            try {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: workflow,
                branch: 'main',
                status: 'success',
                per_page: 100
              });
              for (const run of runs.data.workflow_runs) {
                runIds.add(run.id);
              }
            } catch (error) {
              if (error.status === 404 && attempt === 0) {
                console.log(`Workflow ${workflow} was not found`);
                return;
              }
              runsListFailed = true;
              console.log(`Listing runs for workflow ${workflow} failed on attempt ${attempt + 1}: ${error.message}`);
            }

            if (runIds.size === 0 && !runsListFailed) {
              console.log(`No successful runs found for workflow ${workflow} on main`);
              return;
            }

            if (runIds.size > 0) {
              try {
                const artifacts = await github.rest.actions.listArtifactsForRepo({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: artifactName,
                  per_page: 100
                });
                for (const artifact of artifacts.data.artifacts) {
                  if (artifact.name === artifactName && !artifact.expired) {
                    seenArtifacts.set(artifact.id, artifact);
                  }
                }
              } catch (error) {
                artifactsListFailed = true;
                console.log(`Listing ${artifactName} artifacts failed on attempt ${attempt + 1}: ${error.message}`);
              }
            }

            newest = newestMatching();
            const createdAtMs = newest ? Date.parse(newest.created_at) || 0 : 0;
            const stale = Boolean(newest) && createdAtMs < Date.now() - fiveDaysMs;
            if (!stale && !runsListFailed && !artifactsListFailed) {
              break;
            }
            if (attempt === maxRetries) {
              break;
            }

            if (stale) {
              console.log(`Stored ${artifactName} artifact ${newest.id} created at ${newest.created_at} is older than 5 days. Searching again for a newer commit (${attempt + 1}/${maxRetries}).`);
            }
            await new Promise(resolve => setTimeout(resolve, 1000));
          }

          if (!newest) {
            console.log(`No unexpired ${artifactName} artifact found for workflow ${workflow} on main`);
            return;
          }

          if ((Date.parse(newest.created_at) || 0) < Date.now() - fiveDaysMs) {
            console.log(`No ${artifactName} artifact newer than 5 days after ${maxRetries} retries. Using artifact ${newest.id} created at ${newest.created_at}.`);
          }

          const runId = newest.workflow_run ? String(newest.workflow_run.id) : '';
          const headSha = newest.workflow_run && newest.workflow_run.head_sha ? newest.workflow_run.head_sha : 'unknown';
          console.log(`Selected ${artifactName} artifact ${newest.id} created at ${newest.created_at} from commit ${headSha} by run ${runId || 'unknown'}`);

          try {
            const download = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: newest.id,
              archive_format: 'zip'
            });
            fs.writeFileSync(zipPath, Buffer.from(download.data));
          } catch (error) {
            console.log(`Downloading artifact ${newest.id} failed: ${error.message}`);
            return;
          }

          core.setOutput('zip-path', zipPath);

    - name: Extract previous component tags
      if: steps.download-previous-tags.outputs.zip-path != ''
      shell: bash
      env:
        ZIP_PATH: ${{ steps.download-previous-tags.outputs.zip-path }}
      run: |
        if ! unzip -o "$ZIP_PATH" -d .; then
          echo "Could not extract the downloaded component-tags archive"
        fi
        rm -f "$ZIP_PATH"

    - name: Check if artifact was found
      id: check-tags-artifact
      shell: bash
      run: ${{ github.action_path }}/scripts/check-artifact.sh

    - name: Prepare previous SHAs for comparison
      shell: bash
      env:
        COMPONENTS_JSON: ${{ steps.extract-components.outputs.components_json }}
      run: ${{ github.action_path }}/scripts/prepare-previous-tags.sh

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: "${{ github.action_path }}/go.mod"
        cache-dependency-path: "${{ github.action_path }}/go.sum"

    - name: Build change detector
      shell: bash
      run: ${{ github.action_path }}/scripts/build-detector.sh

    - name: Detect changes
      id: detect
      shell: bash
      env:
        FORCE_REBUILD_ALL: ${{ inputs.force-rebuild-all }}
        FORCE_COMPONENTS: ${{ inputs.force-components }}
        COMPONENTS_JSON: ${{ steps.extract-components.outputs.components_json }}
        TARGET_REF: ${{ inputs.target-ref }}
        CONFIG_FILE: ${{ inputs.config-file }}
        # Use actual PR commit SHA, not the temporary merge commit
        COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        REPO_ROOT: ${{ github.workspace }}
        BINARY_PATH: ${{ github.action_path }}/changed-components
      run: ${{ github.action_path }}/scripts/detect-changes --github-output
