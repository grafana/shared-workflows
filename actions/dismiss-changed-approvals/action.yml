name: "Dismiss Changed Approvals"
description: "Dismisses pull-request approvals only when the reviewed content actually changed"
inputs:
  github-token:
    description: "Token used to call the GitHub API"
    required: false
    default: ${{ github.token }}
  dry-run:
    description: "Log verdicts without dismissing any approvals"
    required: false
    default: "false"
runs:
  using: "node24"
  main: "dist/index.js"
